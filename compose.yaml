name: aiops-canvas
services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/dev-init.sh first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aiops -d aiops"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    profiles: [app]
    build: .
    environment:
      DATABASE_URL: postgres://aiops:${POSTGRES_PASSWORD}@db:5432/aiops?sslmode=disable
      AIOPS_ADDR: 0.0.0.0:8080
      AIOPS_ADMIN_EMAIL: ${AIOPS_ADMIN_EMAIL:-admin@localhost}
      AIOPS_ADMIN_PASSWORD: ${AIOPS_ADMIN_PASSWORD:?Run scripts/dev-init.sh first}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.6:latest}
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: bge-m3
      EMBEDDING_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${AIOPS_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
