apiVersion: v1
kind: Namespace
metadata:
  name: aiops-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: aiops-demo
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: checkout
          image: aiops-canvas-demo:local
          imagePullPolicy: Never
          env: [{name: MODE, value: stable}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 2}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: checkout, namespace: aiops-demo}
spec:
  selector: {app: checkout}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: traffic, namespace: aiops-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: traffic}}
  template:
    metadata: {labels: {app: traffic}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: traffic
          image: aiops-canvas-demo:local
          imagePullPolicy: Never
          env: [{name: ROLE, value: traffic}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: canvas-connector, namespace: aiops-demo}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: canvas-connector, namespace: aiops-demo}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [checkout]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["http:checkout:8080"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: canvas-connector, namespace: aiops-demo}
subjects: [{kind: ServiceAccount, name: canvas-connector, namespace: aiops-demo}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: canvas-connector}
