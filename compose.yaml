name: aiops-canvas
services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/dev-init.sh first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aiops -d aiops"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    profiles: [app]
    build: .
    environment:
      DATABASE_URL: postgres://aiops:${POSTGRES_PASSWORD}@db:5432/aiops?sslmode=disable
      AIOPS_ADDR: 0.0.0.0:8080
      AIOPS_ADMIN_EMAIL: ${AIOPS_ADMIN_EMAIL:-admin@localhost}
      AIOPS_ADMIN_PASSWORD: ${AIOPS_ADMIN_PASSWORD:?Run scripts/dev-init.sh first}
      AIOPS_PUBLIC_ORIGIN: ${AIOPS_PUBLIC_ORIGIN:-}
      AIOPS_SECURE_COOKIES: ${AIOPS_SECURE_COOKIES:-false}
      AIOPS_TRUSTED_PROXY_CIDRS: ${AIOPS_TRUSTED_PROXY_CIDRS:-}
      AIOPS_V3_INSTANCE_CONFIG: /run/redstring/instance.json
      OLLAMA_API: chat_completions
      OLLAMA_MODEL: ${OLLAMA_MODEL-}
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_BASE_URL: http://host.docker.internal:11434
    volumes:
      - type: bind
        source: ${AIOPS_COMPOSE_INSTANCE_CONFIG:-./docs/examples/v3-instance.nonprod.json}
        target: /run/redstring/instance.json
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${AIOPS_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 40
volumes:
  database:
